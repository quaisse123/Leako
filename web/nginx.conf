# Redirection HTTP → HTTPS (les deux domaines)
server {
    listen 80;
    server_name leako.duckdns.org leako.quaisse.me;

    # Challenge ACME pour renouvellement Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # Tout le reste → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Serveur HTTPS — leako.duckdns.org
server {
    listen 443 ssl;
    server_name leako.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/leako.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/leako.duckdns.org/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Challenge ACME (renouvellement)
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # Support SPA routing (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache assets statiques
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API vers le backend
    location /api/ {
        proxy_pass http://84.235.230.47:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fichiers uploadés (photos/vidéos/audio)
    location /uploads/ {
        proxy_pass http://84.235.230.47:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # APK mobile (téléchargement application)
    location /apk/ {
        alias /usr/share/nginx/html/apk/;
        types {
            application/vnd.android.package-archive apk;
        }
        add_header Content-Disposition "attachment";
        expires 1h;
    }
}

