services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./backend/Fuites Media:/app/Fuites Media
    environment:
      # Clé API Gemini injectée au runtime (secret GitHub ou fichier .env sur le VPS).
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: always
